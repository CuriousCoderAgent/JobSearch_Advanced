<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="40%" cy="32%" r="78%">
      <stop offset="0" stop-color="#39405a"/>
      <stop offset="0.55" stop-color="#262a3b"/>
      <stop offset="1" stop-color="#171a25"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f1ff"/>
      <stop offset="0.5" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#8aa2ff"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="0.6" stop-color="#f7bf4f"/>
      <stop offset="1" stop-color="#e59b25"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <!-- Badge -->
  <circle cx="512" cy="512" r="488" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="480" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="10"/>
  <!-- Orbits: a soft glow under a crisp ring -->
  <g transform="translate(512 512)">
    <g filter="url(#glow)" opacity="0.55" fill="none" stroke="#8fd8ff" stroke-width="34">
      <ellipse rx="340" ry="128"/>
      <ellipse rx="340" ry="128" transform="rotate(60)"/>
      <ellipse rx="340" ry="128" transform="rotate(-60)"/>
    </g>
    <g fill="none" stroke="url(#orbit)" stroke-width="24" stroke-linecap="round">
      <ellipse rx="340" ry="128"/>
      <ellipse rx="340" ry="128" transform="rotate(60)"/>
      <ellipse rx="340" ry="128" transform="rotate(-60)"/>
    </g>
    <!-- Electrons riding the orbits -->
    <circle cx="-340" cy="0" r="30" fill="#c7f3ff"/>
    <g transform="rotate(60)"><circle cx="340" cy="0" r="30" fill="#c7f3ff"/></g>
    <!-- Radar nucleus: gold core with two ping rings -->
    <circle r="150" fill="none" stroke="#f5b544" stroke-opacity="0.22" stroke-width="12"/>
    <circle r="108" fill="none" stroke="#f5b544" stroke-opacity="0.45" stroke-width="12"/>
    <circle r="74" fill="#f5b544" opacity="0.6" filter="url(#coreGlow)"/>
    <circle r="66" fill="url(#core)"/>
    <circle cx="-20" cy="-22" r="18" fill="#fff6dc" opacity="0.65"/>
  </g>
</svg>
